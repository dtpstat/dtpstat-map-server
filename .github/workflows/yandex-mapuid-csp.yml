name: Verify Yandex mapuid CSP fix

on:
  push:
    branches:
      - fix/yandex-mapuid-csp

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply CSP patch
        run: python3 scripts/apply-yandex-mapuid-csp-fix.py

      - name: Remove temporary maintenance files
        run: rm .github/workflows/yandex-mapuid-csp.yml scripts/apply-yandex-mapuid-csp-fix.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run check

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allow Yandex mapuid image in CSP'
          git push origin HEAD:fix/yandex-mapuid-csp
