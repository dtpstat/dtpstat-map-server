name: Temporary Mapbox OSM editor check

on:
  push:
    branches:
      - feature/osm-boundary-management
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: dtpstat_ci
      DATABASE_ROLE: dtpstat_ci
      DATABASE_ROLE_PASSWORD: dtpstat-ci-password
      DATABASE_SCHEMA: dtpstat_ci
      DATABASE_SSL: "false"
      POSTGRES_ADMIN_DATABASE: postgres
      POSTGRES_ADMIN_USER: postgres
      POSTGRES_ADMIN_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: test ! -d node_modules/leaflet
      - run: npm run check
      - run: npm run db:init
      - run: npm run db:migrate
