name: Verify analytics fixes

on:
  push:
    branches:
      - fix/analytics-loaders

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analytics-loaders
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply fixes
        run: python3 scripts/apply-analytics-fix.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run check

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/analytics-fix.yml
          rm scripts/apply-analytics-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix analytics loading and CSP"
          git push origin HEAD:fix/analytics-loaders
