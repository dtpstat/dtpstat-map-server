name: Verify detailed admin audit

on:
  push:
    branches:
      - feature/audit-change-details

permissions:
  contents: write

jobs:
  implement-and-check:
    if: github.event.head_commit.message == 'Run detailed audit verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit-change-details
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply implementation
        run: python3 scripts/tmp-audit-patch.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run check

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record concrete admin changes in audit'
          git push origin HEAD:feature/audit-change-details
