<!doctype html>
<html lang="ru" data-theme="{{PROJECT_THEME_NAME}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="{{PROJECT_NAME}} — рейтинг городов и открытые картографические данные."
    >
    <meta name="keywords" content="{{PROJECT_KEYWORDS}}">
    <meta name="application-name" content="{{PROJECT_NAME}}">
    <meta name="apple-mobile-web-app-title" content="{{PROJECT_NAME}}">
    <meta name="theme-color" content="#0b555f">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{PROJECT_NAME}}">
    <meta property="og:site_name" content="{{PROJECT_NAME}}">
    <meta
      property="og:description"
      content="{{PROJECT_NAME}} — рейтинг городов и открытые картографические данные."
    >
    <meta property="og:image" content="/bus-lanes.jpeg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{PROJECT_NAME}}">
    <meta
      name="twitter:description"
      content="{{PROJECT_NAME}} — рейтинг городов и открытые картографические данные."
    >
    <meta name="twitter:image" content="/bus-lanes.jpeg">
    {{PROJECT_METRICS_META}}
    <title>{{PROJECT_NAME}}</title>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/vendor/mapbox-gl/mapbox-gl.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/project-content.css">
    {{PROJECT_THEME_STYLESHEET}}
  </head>
  <body>
    <div class="app-shell">
      <aside class="ranking-panel" aria-labelledby="page-title">
        <header class="ranking-header">
          <p class="eyebrow">
            Карта и открытые данные
            <a class="about-link" href="#project-footer">О проекте</a>
          </p>
          <h1 id="page-title">{{PROJECT_NAME}}</h1>
          <p class="subtitle">Рейтинг городов</p>

          <div class="category-switch" role="group" aria-label="Категория города">
            <button
              class="category-button is-active"
              type="button"
              data-category="large"
              aria-pressed="true"
            >
              Крупные города
            </button>
            <button
              class="category-button"
              type="button"
              data-category="small"
              aria-pressed="false"
            >
              Малые города
            </button>
          </div>
        </header>

        <div class="ranking-scroll">
          <table class="city-table">
            <caption class="visually-hidden">Рейтинг городов</caption>
            <thead></thead>
            <tbody class="city-table-status" hidden>
              <tr>
                <td
                  id="status"
                  class="status column-city"
                  role="status"
                  aria-live="polite"
                  colspan="1"
                  hidden
                ></td>
              </tr>
            </tbody>
            <tbody id="city-list"></tbody>
          </table>

          <section
            class="about project-footer"
            id="project-footer"
            aria-label="Информация о проекте"
          >
{{PROJECT_FOOTER_HTML}}
          </section>
        </div>
      </aside>

      <main class="map-panel" aria-label="Карта проекта {{PROJECT_NAME}}">
        <div id="map"></div>
        <div id="map-message" class="map-message">Подготавливаем карту…</div>
      </main>
    </div>

    <noscript>
      {{YANDEX_METRIKA_NOSCRIPT}}
      <p class="noscript-message">Для интерактивной карты необходимо включить JavaScript.</p>
    </noscript>

    <script src="/vendor/mapbox-gl/mapbox-gl.js"></script>
    <script type="module" src="/js/app.js"></script>
    {{PROJECT_METRICS_SCRIPT}}
  </body>
</html>
