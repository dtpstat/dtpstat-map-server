groups:
  - name: dtpstat
    rules:
      - alert: DTPStatMetricsMissing
        expr: up{job=~"dtpstat.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DTP-Stat metrics target is unavailable
          description: Prometheus has been unable to scrape the DTP-Stat target for 2 minutes.

      - alert: DTPStatHighServerErrorRate
        expr: |
          (
            sum by (job, instance) (
              rate(dtpstat_http_requests_total{status_code=~"5.."}[5m])
            )
            /
            clamp_min(
              sum by (job, instance) (
                rate(dtpstat_http_requests_total[5m])
              ),
              0.001
            )
          ) > 0.05
          and
          sum by (job, instance) (
            rate(dtpstat_http_requests_total[5m])
          ) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: DTP-Stat server error ratio is high
          description: More than 5% of API requests are 5xx while traffic exceeds 0.1 requests/s.

      - alert: DTPStatHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, instance, le) (
              rate(dtpstat_http_request_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: DTP-Stat API p95 latency is high
          description: API request p95 latency has exceeded 1 second for 10 minutes.

      - alert: DTPStatDbPoolWaiters
        expr: dtpstat_db_pool_connections{state="waiting"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DTP-Stat PostgreSQL pool has waiting clients
          description: At least one request has waited for a PostgreSQL connection for 5 minutes.

      - alert: DTPStatDbPoolSaturation
        expr: |
          (
            dtpstat_db_pool_connections{state="total"}
            - ignoring(state)
            dtpstat_db_pool_connections{state="idle"}
          )
          /
          ignoring(state)
          dtpstat_db_pool_max_connections
          > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: DTP-Stat PostgreSQL pool is saturated
          description: More than 90% of configured PostgreSQL connections are active for 10 minutes.

      - alert: DTPStatAdminAuthPressure
        expr: |
          sum by (job, instance) (
            rate(
              dtpstat_http_requests_total{
                route=~"/api/admin/login(?:/mfa)?",
                status_code=~"401|423|429"
              }[5m]
            )
          ) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: DTP-Stat admin authentication failures are elevated
          description: Authentication rejection rate has exceeded 0.1 requests/s for 10 minutes.
