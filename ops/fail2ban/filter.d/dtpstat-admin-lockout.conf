[Definition]
# DTP-Stat emits one compact JSON object after the "[security]" marker.
# Ban only after the application itself has crossed its configured lockout
# threshold. Ordinary failed logins and isolated request incidents do not match.
failregex = ^.*\[security\] \{"marker":"DTPSTAT_SECURITY_V1","event":"(?:admin\.auth\.ip_lockout|admin\.request\.ip_lockout)",.*"ip":"<HOST>".*\}$
ignoreregex =
